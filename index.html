<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Luxury Fashion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
    }

    /* Left Panel - Image Section */
    .image-section {
      flex: 1.2;
      position: relative;
      background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.4)), 
                  url('data:image/svg+xml,<svg width="1200" height="1600" xmlns="http://www.w3.org/2000/svg"><rect width="1200" height="1600" fill="%23DC2626"/><text x="50%" y="50%" font-family="serif" font-size="200" fill="white" opacity="0.1" text-anchor="middle" dominant-baseline="middle">LUXURY</text></svg>');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 60px;
      overflow: hidden;
    }

    .image-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        repeating-linear-gradient(
          45deg,
          transparent,
          transparent 10px,
          rgba(255, 255, 255, 0.02) 10px,
          rgba(255, 255, 255, 0.02) 20px
        );
      pointer-events: none;
    }

    .brand-logo {
      position: relative;
      z-index: 2;
    }

    .brand-logo h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3rem;
      font-weight: 300;
      color: #ffffff;
      letter-spacing: 4px;
      text-transform: capitalize;
      margin-bottom: 10px;
      word-break: break-word;
    }

    .brand-tagline {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 300;
    }

    .image-content {
      position: relative;
      z-index: 2;
      color: #ffffff;
    }

    .collection-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3.5rem;
      font-weight: 300;
      line-height: 1.2;
      margin-bottom: 20px;
      font-style: italic;
    }

    .collection-description {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.95rem;
      letter-spacing: 1px;
      line-height: 1.8;
      max-width: 500px;
      font-weight: 300;
      opacity: 0.95;
    }

    /* Right Panel - Form Section */
    .form-section {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px;
      background: #ffffff;
      position: relative;
    }

    .form-section::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 200px;
      height: 200px;
      background: linear-gradient(135deg, rgba(220, 38, 38, 0.03) 0%, transparent 100%);
      border-radius: 0 0 0 100%;
    }

    .form-wrapper {
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 2;
    }

    .form-header {
      margin-bottom: 60px;
      text-align: center;
    }

    .form-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3.5rem;
      font-weight: 300;
      color: #111827;
      margin-bottom: 15px;
      letter-spacing: 2px;
    }

    .form-subtitle {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.9rem;
      color: #6b7280;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 300;
    }

    .divider {
      width: 60px;
      height: 1px;
      background: #dc2626;
      margin: 30px auto;
    }

    .input-group {
      margin-bottom: 35px;
      position: relative;
    }

    .input-group label {
      display: block;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      color: #111827;
      margin-bottom: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .input-group input {
      width: 100%;
      padding: 18px 0;
      border: none;
      border-bottom: 1px solid #e5e7eb;
      font-size: 1.1rem;
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      transition: all 0.3s ease;
      background: transparent;
      color: #111827;
      letter-spacing: 0.5px;
    }

    .input-group input:focus {
      outline: none;
      border-bottom-color: #dc2626;
    }

    .input-group input::placeholder {
      color: #d1d5db;
      font-weight: 300;
    }

    .input-underline {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: #dc2626;
      transition: width 0.3s ease;
    }

    .input-group input:focus ~ .input-underline {
      width: 100%;
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .remember-me input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #dc2626;
    }

    .remember-me label {
      font-size: 0.85rem;
      color: #6b7280;
      cursor: pointer;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    .forgot-password {
      font-size: 0.85rem;
      color: #6b7280;
      text-decoration: none;
      transition: color 0.3s ease;
      letter-spacing: 0.5px;
      font-weight: 400;
    }

    .forgot-password:hover {
      color: #dc2626;
    }

    .submit-btn {
      width: 100%;
      padding: 20px;
      background: #dc2626;
      color: #ffffff;
      border: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.4s ease;
      letter-spacing: 3px;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
    }

    .submit-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s ease;
    }

    .submit-btn:hover::before {
      left: 100%;
    }

    .submit-btn:hover {
      background: #b91c1c;
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(220, 38, 38, 0.3);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .create-account {
      text-align: center;
      margin-top: 40px;
      padding-top: 40px;
      border-top: 1px solid #f3f4f6;
    }

    .create-account p {
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }

    .create-account a {
      color: #dc2626;
      text-decoration: none;
      font-weight: 500;
      letter-spacing: 1px;
      transition: color 0.3s ease;
      text-transform: uppercase;
      font-size: 0.85rem;
    }

    .create-account a:hover {
      color: #b91c1c;
      text-decoration: underline;
    }

    .social-login {
      margin-top: 50px;
    }

    .social-divider {
      display: flex;
      align-items: center;
      margin-bottom: 25px;
      color: #9ca3af;
      font-size: 0.8rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .social-divider::before,
    .social-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }

    .social-divider::before {
      margin-right: 20px;
    }

    .social-divider::after {
      margin-left: 20px;
    }

    .social-buttons {
      display: flex;
      gap: 15px;
    }

    .social-btn {
      flex: 1;
      padding: 15px;
      border: 1px solid #e5e7eb;
      background: #ffffff;
      color: #6b7280;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 500;
    }

    .social-btn:hover {
      border-color: #dc2626;
      color: #dc2626;
      background: #fef2f2;
    }

    /* Decorative Elements */
    .corner-decoration {
      position: absolute;
      bottom: 40px;
      right: 40px;
      width: 80px;
      height: 80px;
      border: 1px solid rgba(220, 38, 38, 0.2);
      border-left: none;
      border-top: none;
    }

    /* Responsive */
    @media screen and (max-width: 1200px) {
      .image-section,
      .form-section {
        padding: 60px 50px;
      }

      .brand-logo h1 {
        font-size: 3rem;
      }

      .collection-text {
        font-size: 2.5rem;
      }
    }

    @media screen and (max-width: 968px) {
      body {
        flex-direction: column;
      }

      .image-section {
        min-height: 40vh;
        padding: 40px 30px;
      }

      .brand-logo h1 {
        font-size: 2.5rem;
        letter-spacing: 4px;
      }

      .collection-text {
        font-size: 2rem;
      }

      .form-section {
        padding: 60px 30px;
      }

      .form-title {
        font-size: 2.5rem;
      }

      .corner-decoration {
        display: none;
      }
    }

    @media screen and (max-width: 480px) {
      .image-section {
        padding: 30px 20px;
      }

      .form-section {
        padding: 40px 20px;
      }

      .brand-logo h1 {
        font-size: 2rem;
      }

      .form-title {
        font-size: 2rem;
      }

      .social-buttons {
        flex-direction: column;
      }
    }

    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-wrapper {
      animation: fadeInUp 0.8s ease-out;
    }

    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-50px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .brand-logo,
    .image-content {
      animation: slideInLeft 1s ease-out;
    }

    .image-content {
      animation-delay: 0.2s;
    }
  </style>
</head>
<body>
  <!-- Left Panel - Image Section -->
  <div class="image-section">
    <div class="brand-logo">
      <h1>Cecelialaurente</h1>
      <p class="brand-tagline">Since 2024</p>
    </div>
    
    <div class="image-content">
      <h2 class="collection-text">Spring/Summer<br>2026 Collection</h2>
      <p class="collection-description">
        Discover the epitome of elegance and sophistication. 
        Where timeless craftsmanship meets contemporary luxury.
      </p>
    </div>
  </div>

  <!-- Right Panel - Form Section -->
  <div class="form-section">
    <div class="form-wrapper">
      <div class="form-header">
        <h2 class="form-title">Welcome</h2>
        <div class="divider"></div>
        <p class="form-subtitle">Sign in to your account</p>
      </div>

      <form id="login-form">
        <div class="input-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="your@email.com" 
            required 
          />
          <div class="input-underline"></div>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Enter your password" 
            required 
          />
          <div class="input-underline"></div>
        </div>

        <div class="form-options">
          <div class="remember-me">
            <input type="checkbox" id="remember" name="remember">
            <label for="remember">Remember me</label>
          </div>
          <a href="#" class="forgot-password" id="forgot-link">Forgot Password?</a>
        </div>

        <button type="submit" class="submit-btn">Sign In</button>

        <div class="social-login">
          <div class="social-divider">Or continue with</div>
          <div class="social-buttons">
            <button type="button" class="social-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
              </svg>
              Google
            </button>
            <button type="button" class="social-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M9.101 23.691v-7.98H6.627v-3.667h2.474v-1.58c0-4.085 1.848-5.978 5.858-5.978.401 0 .955.042 1.468.103a8.68 8.68 0 0 1 1.141.195v3.325a8.623 8.623 0 0 0-.653-.036 26.805 26.805 0 0 0-.733-.009c-.707 0-1.259.096-1.675.309a1.686 1.686 0 0 0-.679.622c-.258.42-.374.995-.374 1.752v1.297h3.919l-.386 2.103-.287 1.564h-3.246v8.245C19.396 23.238 24 18.179 24 12.044c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.628 3.874 10.35 9.101 11.647Z"/>
              </svg>
              Facebook
            </button>
          </div>
        </div>

        <div class="create-account">
          <p>Don't have an account?</p>
          <a href="#" id="create-account-link">Create Account</a>
        </div>
      </form>
    </div>

    <div class="corner-decoration"></div>
  </div>

  <script>
    // Login form submission
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const formData = {
        email: e.target.email.value,
        password: e.target.password.value,
        remember: e.target.remember.checked
      };

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(formData)
        });

        const data = await response.json();
        
        if (response.ok) {
          // Success - redirect to dashboard or home
          window.location.href = '/dashboard';
        } else {
          alert(data.message || 'Login failed. Please check your credentials.');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('An error occurred. Please try again later.');
      }
    });

    // Forgot password
    document.getElementById('forgot-link').addEventListener('click', (e) => {
      e.preventDefault();
      alert('Password recovery link will be sent to your email.');
    });

    // Create account
    document.getElementById('create-account-link').addEventListener('click', (e) => {
      e.preventDefault();
      // Redirect to signup page or show signup modal
      window.location.href = '/signup';
    });

    // Social login buttons
    document.querySelectorAll('.social-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const provider = btn.textContent.trim();
        alert(`${provider} login will be implemented`);
      });
    });

    // Input focus effects
    document.querySelectorAll('.input-group input').forEach(input => {
      input.addEventListener('focus', function() {
        this.parentElement.querySelector('.input-underline')?.classList.add('active');
      });
      
      input.addEventListener('blur', function() {
        this.parentElement.querySelector('.input-underline')?.classList.remove('active');
      });
    });
  </script>
</body>
</html>
